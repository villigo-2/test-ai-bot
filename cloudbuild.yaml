steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'europe-west1-docker.pkg.dev/umico-client/telegram-bot/telegram-bot-app:$COMMIT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'europe-west1-docker.pkg.dev/umico-client/telegram-bot/telegram-bot-app:$COMMIT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'telegram-bot-app'
    - '--image'
    - 'europe-west1-docker.pkg.dev/umico-client/telegram-bot/telegram-bot-app:$COMMIT_SHA'
    - '--region'
    - 'europe-west1'
    - '--platform'
    - 'managed'
    - '--quiet'
    - '--set-env-vars'
    - 'ENV=production'
images:
- 'europe-west1-docker.pkg.dev/umico-client/telegram-bot/telegram-bot-app:$COMMIT_SHA'
